server {
    listen 8080;
    server_name localhost;

    # Rota principal repassando para a aplicação Node.js (ajuste a porta da API se necessário)
    location /api/v1/proxy/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Rota de status retornando JSON direto (sem passar pelo Node.js)
    location /status-nginx {
        default_type application/json;
        return 200 '{"status": "online", "service": "Nginx", "code": 200}';
    }
}
