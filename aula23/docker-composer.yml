cat << 'EOF' > docker-compose.yml
version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: aula23_redis
    ports:
      - "6379:6379"
    volumes:
      - aula23_redis_data:/data

  api:
    build: .
    container_name: aula23_api
    ports:
      - "3333:3333"
    depends_on:
      - redis

volumes:
  aula23_redis_data:
    external: true
EOF
